<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rubik's Cube Layout</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8f8f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .cube-container {
        display: grid;
        grid-template-columns: repeat(4, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 10px;
        position: relative;
      }

      .face {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        border: 2px solid #000;
      }

      .square {
        border: 1px solid #000;
      }

      .f .square {
        background: red;
      }
      .r .square {
        background: green;
      }
      .l .square {
        background: blue;
      }
      .u .square {
        background: yellow;
      }
      .d .square {
        background: white;
      }
      .b .square {
        background: orange;
      }

      .u {
        grid-column: 2;
        grid-row: 1;
      }
      .l {
        grid-column: 1;
        grid-row: 2;
      }
      .f {
        grid-column: 2;
        grid-row: 2;
      }
      .r {
        grid-column: 3;
        grid-row: 2;
      }
      .d {
        grid-column: 2;
        grid-row: 3;
      }
      .b {
        grid-column: 4;
        grid-row: 2;
      }

      .buttons {
        display: flex;
        justify-content: space-between;
        width: 60%;
        margin-top: 20px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #eee;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #ddd;
      }

      .steps {
        margin-top: 20px;
        width: 80%;
        text-align: center;
        font-family: monospace;
        font-size: 14px;
        padding: 10px;
        border-top: 2px solid #333;
      }

      .move-buttons {
        position: absolute;
        top: -20px;
        right: -180px;
        display: grid;
        grid-template-columns: repeat(3, 50px);
        grid-gap: 10px;
      }

      .move-buttons button {
        padding: 8px;
        font-size: 14px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="cube-container">
      <div class="face u">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>
      <div class="face l">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>
      <div class="face f">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>
      <div class="face r">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>
      <div class="face d">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>
      <div class="face b">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <div class="move-buttons">
        <button data-move="R">R</button>
        <button data-move="U">U</button>
        <button data-move="F">F</button>
        <button data-move="R'">R'</button>
        <button data-move="U'">U'</button>
        <button data-move="F'">F'</button>
        <button data-move="B">B</button>
        <button data-move="B'">B'</button>
      </div>
    </div>

    <div class="buttons">
      <button id="shuffle">Shuffle</button>
      <button id="solve">Solve</button>
    </div>

    <div class="steps">Steps:</div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let cube = {
          U: Array(9).fill("yellow"),
          D: Array(9).fill("white"),
          F: Array(9).fill("red"),
          B: Array(9).fill("orange"),
          L: Array(9).fill("blue"),
          R: Array(9).fill("green"),
        };

        const faceMap = {
          U: document.querySelectorAll(".u .square"),
          D: document.querySelectorAll(".d .square"),
          F: document.querySelectorAll(".f .square"),
          B: document.querySelectorAll(".b .square"),
          L: document.querySelectorAll(".l .square"),
          R: document.querySelectorAll(".r .square"),
        };

        function renderCube() {
          for (let face in cube) {
            cube[face].forEach((color, i) => {
              faceMap[face][i].style.background = color;
            });
          }
        }

        function rotateFace(face) {
          cube[face] = [
            cube[face][6],
            cube[face][3],
            cube[face][0],
            cube[face][7],
            cube[face][4],
            cube[face][1],
            cube[face][8],
            cube[face][5],
            cube[face][2],
          ];
        }
        function rotateFaceCCW(face) {
          cube[face] = [
            cube[face][2],
            cube[face][5],
            cube[face][8],
            cube[face][1],
            cube[face][4],
            cube[face][7],
            cube[face][0],
            cube[face][3],
            cube[face][6],
          ];
        }

        function moveU() {
          rotateFace("U");
          let temp = cube["F"].slice(0, 3);
          cube["F"].splice(0, 3, ...cube["R"].slice(0, 3));
          cube["R"].splice(0, 3, ...cube["B"].slice(0, 3));
          cube["B"].splice(0, 3, ...cube["L"].slice(0, 3));
          cube["L"].splice(0, 3, ...temp);
        }
        function moveUPrime() {
          moveU();
          moveU();
          moveU();
        }

        function moveR() {
          rotateFace("R");
          let temp = [cube["U"][2], cube["U"][5], cube["U"][8]];
          [cube["U"][2], cube["U"][5], cube["U"][8]] = [
            cube["F"][2],
            cube["F"][5],
            cube["F"][8],
          ];
          [cube["F"][2], cube["F"][5], cube["F"][8]] = [
            cube["D"][2],
            cube["D"][5],
            cube["D"][8],
          ];
          [cube["D"][2], cube["D"][5], cube["D"][8]] = [
            cube["B"][6],
            cube["B"][3],
            cube["B"][0],
          ];
          [cube["B"][6], cube["B"][3], cube["B"][0]] = temp;
        }
        function moveRPrime() {
          moveR();
          moveR();
          moveR();
        }

        function moveF() {
          rotateFace("F");
          let temp = [cube["U"][6], cube["U"][7], cube["U"][8]];
          [cube["U"][6], cube["U"][7], cube["U"][8]] = [
            cube["L"][8],
            cube["L"][5],
            cube["L"][2],
          ];
          [cube["L"][2], cube["L"][5], cube["L"][8]] = [
            cube["D"][2],
            cube["D"][1],
            cube["D"][0],
          ];
          [cube["D"][0], cube["D"][1], cube["D"][2]] = [
            cube["R"][0],
            cube["R"][3],
            cube["R"][6],
          ];
          [cube["R"][0], cube["R"][3], cube["R"][6]] = temp;
        }
        function moveFPrime() {
          moveF();
          moveF();
          moveF();
        }

        function moveB() {
          rotateFace("B");
          let temp = [cube["U"][0], cube["U"][1], cube["U"][2]];
          [cube["U"][0], cube["U"][1], cube["U"][2]] = [
            cube["R"][2],
            cube["R"][5],
            cube["R"][8],
          ];
          [cube["R"][2], cube["R"][5], cube["R"][8]] = [
            cube["D"][8],
            cube["D"][7],
            cube["D"][6],
          ];
          [cube["D"][6], cube["D"][7], cube["D"][8]] = [
            cube["L"][6],
            cube["L"][3],
            cube["L"][0],
          ];
          [cube["L"][0], cube["L"][3], cube["L"][6]] = temp;
        }
        function moveBPrime() {
          moveB();
          moveB();
          moveB();
        }

        const moveMap = {
          U: moveU,
          "U'": moveUPrime,
          R: moveR,
          "R'": moveRPrime,
          F: moveF,
          "F'": moveFPrime,
          B: moveB,
          "B'": moveBPrime,
        };

        const stepsLog = document.querySelector(".steps");
        function logStep(step) {
          stepsLog.textContent += " " + step;
        }

        function applyMoves(moves, delay = 400, log = true) {
          let i = 0;
          function next() {
            if (i < moves.length) {
              moveMap[moves[i]]();
              renderCube();
              if (log) logStep(moves[i]);
              i++;
              setTimeout(next, delay);
            }
          }
          next();
        }

        document.querySelectorAll(".move-buttons button").forEach((btn) => {
          btn.addEventListener("click", () => {
            let move = btn.dataset.move;
            moveMap[move]();
            renderCube();
            logStep(move);
          });
        });

        document.getElementById("shuffle").addEventListener("click", () => {
          const shuffleSeq = ["R", "U", "R'", "U", "R", "U", "U", "R'"];
          applyMoves(shuffleSeq, 400, false);
        });

        document.getElementById("solve").addEventListener("click", () => {
          const solveSeq = [
            "U",
            "U",
            "R",
            "U",
            "R'",
            "U",
            "R",
            "U",
            "U",
            "R'",
            "U",
            "U",
            "R",
            "U",
            "R'",
            "U",
            "R",
            "U",
            "U",
            "R'",
            "U",
            "U",
          ];
          applyMoves(solveSeq);
        });

        renderCube();
      });
    </script>
  </body>
</html>
